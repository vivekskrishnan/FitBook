# Runs the app plus MySQL. Credentials come from .env (copy .env.example; .env is gitignored).
# Run from this folder: docker compose up --build
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: fitbook
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fitbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # The mock notification service is in the same app, so it is reached on the app's own port.
      NOTIFICATION_BASE_URL: http://localhost:8080
      NOTIFICATION_MOCK_FAIL: ${NOTIFICATION_MOCK_FAIL:-false}
      NOTIFICATION_MOCK_DELAY_MS: ${NOTIFICATION_MOCK_DELAY_MS:-0}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-data:
