# Runs the app plus MySQL. Credentials come from .env (copy .env.example; .env is gitignored).
# Run from this folder: docker compose up --build
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: fitbook
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time setup MySQL runs a temporary socket-only server, and a socket
      # ping would report healthy before the real server accepts connections.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fitbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # The mock notification service is in the same app, so it is reached on the app's own port.
      NOTIFICATION_BASE_URL: http://localhost:8080
      # Signs login tokens for the REST API; at least 32 characters. If empty, a random secret is
      # generated at startup and logins stop working after a restart.
      JWT_SECRET: ${JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-missing-key}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      NOTIFICATION_MOCK_FAIL: ${NOTIFICATION_MOCK_FAIL:-false}
      NOTIFICATION_MOCK_DELAY_MS: ${NOTIFICATION_MOCK_DELAY_MS:-0}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Next.js frontend. The browser talks only to this container; its server-side proxy forwards
  # /api/* to the Spring Boot app and keeps the JWT in an httpOnly cookie.
  frontend:
    build: ../frontend
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND_URL: http://app:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"

volumes:
  mysql-data:
