<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 600px; margin-top: 100px;">
    <div class="alert alert-danger">
        <h1 class="h4" th:text="'Error ' + ${status ?: 500}">Error</h1>
        <p class="mb-0" th:text="${message ?: 'Something went wrong. Please try again.'}">
            Something went wrong.
        </p>
    </div>
    <a class="btn btn-primary" th:href="@{/slots}">Back to slots</a>
</div>
</body>
</html>
