<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - My Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 700px; margin-top: 60px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">My Appointments</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/slots}">Browse slots</a>
    </div>
    <p>Logged in as <strong th:text="${name}">Name</strong> (role: <span th:text="${role}">ROLE</span>)</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <h2 class="h5 mt-4">Upcoming</h2>
    <div th:if="${#lists.isEmpty(upcoming)}" class="text-muted">No upcoming appointments.</div>
    <table th:unless="${#lists.isEmpty(upcoming)}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Trainer</th>
            <th>Service</th>
            <th>When</th>
            <th>Price</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${upcoming}">
            <td th:text="${a.trainerName}">Trainer</td>
            <td th:text="${a.serviceName}">Service</td>
            <td th:text="${#temporals.format(a.startTime, 'MMM d, yyyy h:mm a')}">When</td>
            <td th:text="${'$' + a.price}">Price</td>
            <td>
                <form th:action="@{/my-appointments/{id}/cancel(id=${a.appointmentId})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="h5 mt-4">History</h2>
    <div th:if="${#lists.isEmpty(history)}" class="text-muted">No past appointments.</div>
    <table th:unless="${#lists.isEmpty(history)}" class="table align-middle">
        <thead>
        <tr>
            <th>Trainer</th>
            <th>Service</th>
            <th>When</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${history}">
            <td th:text="${a.trainerName}">Trainer</td>
            <td th:text="${a.serviceName}">Service</td>
            <td th:text="${#temporals.format(a.startTime, 'MMM d, yyyy h:mm a')}">When</td>
            <td th:text="${a.status == 'BOOKED'} ? 'COMPLETED' : ${a.status}">Status</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post" class="mt-4">
        <button type="submit" class="btn btn-outline-secondary">Log out</button>
    </form>
</div>
</body>
</html>
