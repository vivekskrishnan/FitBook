<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - My Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 600px; margin-top: 60px;">
    <h1 class="h3">My Appointments</h1>
    <p>Logged in as <strong th:text="${name}">Name</strong> (role: <span th:text="${role}">ROLE</span>)</p>
    <p class="text-muted">Upcoming and past appointments go here (Phase 2).</p>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary">Log out</button>
    </form>
</div>
</body>
</html>
