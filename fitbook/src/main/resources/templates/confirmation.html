<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">
    <div class="alert alert-success">Your appointment is booked.</div>

    <div class="card mb-3">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Trainer</dt>
                <dd class="col-sm-8" th:text="${appointment.trainerName}">Trainer</dd>

                <dt class="col-sm-4">Service</dt>
                <dd class="col-sm-8" th:text="${appointment.serviceName}">Service</dd>

                <dt class="col-sm-4">When</dt>
                <dd class="col-sm-8">
                    <span th:text="${#temporals.format(appointment.startTime, 'MMM d, yyyy h:mm a')}">Start</span>
                    &ndash;
                    <span th:text="${#temporals.format(appointment.endTime, 'h:mm a')}">End</span>
                </dd>

                <dt class="col-sm-4">Price</dt>
                <dd class="col-sm-8" th:text="${'$' + appointment.price}">Price</dd>

                <dt class="col-sm-4">Status</dt>
                <dd class="col-sm-8" th:text="${appointment.status}">Status</dd>
            </dl>
        </div>
    </div>

    <a class="btn btn-primary" th:href="@{/my-appointments}">View my appointments</a>
    <a class="btn btn-outline-secondary" th:href="@{/slots}">Book another</a>
</div>
</body>
</html>
