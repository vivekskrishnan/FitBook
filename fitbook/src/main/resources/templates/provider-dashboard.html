<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - Provider Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 60px;">
    <h1 class="h3">Provider Dashboard</h1>
    <p>Logged in as <strong th:text="${name}">Name</strong> (role: <span th:text="${role}">ROLE</span>)</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <h2 class="h5 mt-4">My Slots</h2>
    <div th:if="${#lists.isEmpty(slots)}" class="text-muted">No slots yet.</div>
    <table th:unless="${#lists.isEmpty(slots)}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Service</th>
            <th>When</th>
            <th>Price</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${slots}">
            <td th:text="${s.serviceName}">Service</td>
            <td th:text="${#temporals.format(s.startTime, 'MMM d, yyyy h:mm a')} + ' - ' + ${#temporals.format(s.endTime, 'h:mm a')}">When</td>
            <td th:text="${'$' + s.price}">Price</td>
            <td th:text="${s.status}">Status</td>
            <td>
                <form th:if="${s.status == 'OPEN'}" th:action="@{/provider/slots/{id}/delete(id=${s.slotId})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="h5 mt-4">Add a Slot</h2>
    <form th:action="@{/provider/slots}" method="post" class="row g-2 align-items-end">
        <div class="col-auto">
            <label class="form-label" for="startTime">Start</label>
            <input type="datetime-local" class="form-control" id="startTime" name="startTime" required>
        </div>
        <div class="col-auto">
            <label class="form-label" for="endTime">End</label>
            <input type="datetime-local" class="form-control" id="endTime" name="endTime" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Slot</button>
        </div>
    </form>

    <h2 class="h5 mt-4">My Bookings</h2>
    <div th:if="${#lists.isEmpty(bookings)}" class="text-muted">No bookings yet.</div>
    <table th:unless="${#lists.isEmpty(bookings)}" class="table align-middle">
        <thead>
        <tr>
            <th>Service</th>
            <th>When</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings}">
            <td th:text="${b.serviceName}">Service</td>
            <td th:text="${#temporals.format(b.startTime, 'MMM d, yyyy h:mm a')}">When</td>
            <td th:text="${b.status}">Status</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post" class="mt-4">
        <button type="submit" class="btn btn-outline-secondary">Log out</button>
    </form>
</div>
</body>
</html>
