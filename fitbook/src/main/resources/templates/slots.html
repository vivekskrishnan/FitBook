<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - Available Slots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 60px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Available Slots</h1>
        <div>
            <a th:if="${canBook}" class="btn btn-outline-secondary btn-sm" th:href="@{/my-appointments}">My Appointments</a>
            <a th:unless="${canBook}" class="btn btn-outline-primary btn-sm" th:href="@{/login}">Log in to book</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(slots)}" class="alert alert-info">No open slots right now.</div>

    <table th:unless="${#lists.isEmpty(slots)}" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Trainer</th>
            <th>Service</th>
            <th>Start</th>
            <th>End</th>
            <th>Price</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="slot : ${slots}">
            <td th:text="${slot.trainerName}">Trainer</td>
            <td th:text="${slot.serviceName}">Service</td>
            <td th:text="${#temporals.format(slot.startTime, 'MMM d, yyyy h:mm a')}">Start</td>
            <td th:text="${#temporals.format(slot.endTime, 'h:mm a')}">End</td>
            <td th:text="${'$' + slot.price}">Price</td>
            <td>
                <a th:if="${canBook}" class="btn btn-primary btn-sm" th:href="@{/book/{id}(id=${slot.slotId})}">Book</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
