<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - AI Assistant</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #log { height: 420px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; background: #fafafa; }
        .msg { margin-bottom: 10px; white-space: pre-wrap; }
        .me { text-align: right; color: #0d6efd; }
        .bot { color: #212529; }
        .err { color: #dc3545; }
    </style>
</head>
<body>
<div class="container" style="max-width: 700px; margin-top: 40px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">FitBook AI Assistant</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/my-appointments}">My appointments</a>
    </div>
    <p class="text-muted small">Try: "Book the earliest weight training slot" or "Cancel my next appointment".
        I always ask you to confirm before booking or cancelling.</p>
    <div id="log"></div>
    <form id="form" class="d-flex gap-2 mt-3">
        <input id="input" class="form-control" autocomplete="off" placeholder="Type a message..." required>
        <button id="send" class="btn btn-primary" type="submit">Send</button>
    </form>
</div>
<script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const token = document.querySelector('meta[name=_csrf]').content;
    const header = document.querySelector('meta[name=_csrf_header]').content;

    function add(text, cls) {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        add(message, 'me');
        input.value = '';
        send.disabled = true;
        try {
            const res = await fetch('/ai/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', [header]: token},
                body: JSON.stringify({message})
            });
            const data = await res.json();
            add(res.ok ? data.reply : (data.error || 'Something went wrong.'), res.ok ? 'bot' : 'err');
        } catch (err) {
            add('Could not reach the server.', 'err');
        }
        send.disabled = false;
        input.focus();
    });
</script>
</body>
</html>
