<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitBook - Confirm Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">
    <h1 class="h3 mb-3">Confirm Booking</h1>

    <div class="card mb-3">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Trainer</dt>
                <dd class="col-sm-8" th:text="${slot.trainerName}">Trainer</dd>

                <dt class="col-sm-4">Service</dt>
                <dd class="col-sm-8" th:text="${slot.serviceName}">Service</dd>

                <dt class="col-sm-4">When</dt>
                <dd class="col-sm-8">
                    <span th:text="${#temporals.format(slot.startTime, 'MMM d, yyyy h:mm a')}">Start</span>
                    &ndash;
                    <span th:text="${#temporals.format(slot.endTime, 'h:mm a')}">End</span>
                </dd>

                <dt class="col-sm-4">Price</dt>
                <dd class="col-sm-8" th:text="${'$' + slot.price}">Price</dd>
            </dl>
        </div>
    </div>

    <form th:action="@{/book/{id}(id=${slot.slotId})}" method="post">
        <button type="submit" class="btn btn-primary">Confirm booking</button>
        <a class="btn btn-outline-secondary" th:href="@{/slots}">Cancel</a>
    </form>
</div>
</body>
</html>
