spring.application.name=fitbook

spring.datasource.url=jdbc:mysql://localhost:3306/fitbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false

# No stack traces to the client. include-message=always lets Boot's own /error
# dispatch (e.g. a 403 thrown by the security filter chain, which never reaches
# GlobalExceptionHandler) still show a helpful message on templates/error.html.
server.error.include-stacktrace=never
server.error.include-message=always

