spring.application.name=fitbook

# DB_URL is optional: defaults to local MySQL, and docker-compose overrides it to point at the mysql container.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false

# No stack traces to the client. include-message=always lets Boot's own /error
# dispatch (e.g. a 403 thrown by the security filter chain, which never reaches
# GlobalExceptionHandler) still show a helpful message on templates/error.html.
server.error.include-stacktrace=never
server.error.include-message=always

# Notification gateway (Milestone 3). Each value can be overridden by an env var,
# e.g. NOTIFICATION_BASE_URL, NOTIFICATION_MAX_ATTEMPTS.
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080}
notification.connect-timeout-ms=${NOTIFICATION_CONNECT_TIMEOUT_MS:1000}
notification.read-timeout-ms=${NOTIFICATION_READ_TIMEOUT_MS:1500}
notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.retry-backoff-ms=${NOTIFICATION_RETRY_BACKOFF_MS:200}

# Mock notification service failure injection, for demos and tests only.
notification.mock.delay-ms=${NOTIFICATION_MOCK_DELAY_MS:0}
notification.mock.fail=${NOTIFICATION_MOCK_FAIL:false}

# Actuator: expose only metrics over HTTP (/health is our own endpoint).
management.endpoints.web.exposure.include=metrics

logging.level.com.vivekkrishnan.fitbook=INFO

